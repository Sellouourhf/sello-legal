* { box-sizing:border-box; }
body { margin:0; background:var(--surface); color:var(--text);

h1 { font-size:26px; line-height:1.25; color:var(--primary); margin:0 0 8px; }
h2 { font-size:19px; color:var(--primary); margin:30px 0 8px; padding-top:18px; border-top:1px solid var(--line); }
h3 { font-size:16px; color:var(--secondary); margin:20px 0 6px; }
a { color:var(--secondary); }
code { background:#eef5f0; padding:1px 6px; border-radius:6px; font-size:.9em; }
table { width:100%; border-collapse:collapse; margin:12px 0; font-size:14px; display:block; overflow-x:auto; }
th, td { text-align:left; vertical-align:top; padding:8px 10px; border-bottom:1px solid var(--line); }
th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
ul { padding-left:20px; }
footer { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }
